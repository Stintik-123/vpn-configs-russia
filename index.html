<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Configs Russia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .title-font { font-family: 'Space Grotesk', sans-serif; }
    
    .hero-bg video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.4) contrast(1.1);
    }
    
    .glitch {
      animation: glitch 2s linear infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 #fff, -2px 0 #fff; }
      20% { text-shadow: -3px 0 #fff, 3px 0 #fff; }
      40% { text-shadow: 2px 0 #fff, -2px 0 #fff; }
      100% { text-shadow: 2px 0 #fff, -2px 0 #fff; }
    }
    
    .card-hover {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-15px) scale(1.02);
      box-shadow: 0 30px 60px -15px rgb(255 255 255 / 0.1);
    }
  </style>
</head>
<body class="bg-black text-white overflow-x-hidden">
  <section class="hero-bg min-h-screen flex items-center relative">
    <video autoplay loop muted playsinline>
      <source src="https://freestockfootagearchive.com/wp-content/uploads/2020/10/Cyberpunk-Glitch-Motion-Background-Effect-Loop.mp4" type="video/mp4">
    </video>
    
    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/50 to-black/80"></div>
    
    <div class="max-w-7xl mx-auto px-6 text-center relative z-10">
      <div class="mx-auto w-28 h-28 mb-8 flex items-center justify-center text-8xl">🇷🇺</div>
      <h1 class="title-font text-7xl md:text-8xl font-bold tracking-tighter glitch mb-6">VPN CONFIGS<br>RUSSIA</h1>
      <p class="text-2xl md:text-3xl text-zinc-300 max-w-2xl mx-auto mb-12">Свежие конфиги • Проверенные в РФ • Обновление каждые 2 часа</p>
      
      <a href="#subscriptions" class="inline-block px-12 py-6 bg-white text-black font-semibold rounded-3xl text-2xl hover:bg-zinc-200 transition-all">ПОЛУЧИТЬ ПОДПИСКИ →</a>
    </div>

    <div class="absolute bottom-12 left-1/2 -translate-x-1/2 animate-bounce">
      <i class="fas fa-chevron-down text-5xl text-white/60"></i>
    </div>
  </section>
  
  <nav class="sticky top-0 bg-black/95 border-b border-white/10 backdrop-blur-md z-50">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-wrap gap-4 justify-center">
      <a href="#subscriptions" class="nav-btn px-8 py-4 hover:bg-white/10 rounded-3xl transition">📦 Подписки</a>
      <a href="#mirrors" class="nav-btn px-8 py-4 hover:bg-white/10 rounded-3xl transition">🪞 Зеркала</a>
      <a href="#guides" class="nav-btn px-8 py-4 hover:bg-white/10 rounded-3xl transition">📖 Гайды</a>
      <a href="#stats" class="nav-btn px-8 py-4 hover:bg-white/10 rounded-3xl transition">📊 Статистика</a>
    </div>
  </nav>

  <section id="subscriptions" class="py-24 bg-zinc-950">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-6xl font-bold text-center mb-20 title-font tracking-tight">Готовые Подписки</h2>
      
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="subs-container">
      </div>
    </div>
  </section>

  <section id="mirrors" class="py-24 bg-black">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h2 class="text-5xl font-bold mb-12">Зеркала</h2>
      <p class="text-xl text-zinc-400 max-w-xl mx-auto">Если GitHub заблокирован — используй зеркала
    </div>
  </section>

  <footer class="bg-black border-t border-white/10 py-12 text-center text-zinc-500">
    <p>VPN Configs Russia • Свобода без компромиссов</p>
    <a href="https://github.com/Stintik-123/vpn-configs-russia" class="text-white hover:underline mt-2 inline-block">GitHub</a>
  </footer>

  <script>
    const subscriptions = [
      {
        title: "BLACK VLESS RUS Mobile",
        desc: "Оптимально для телефонов • Чёрные списки",
        url: "https://raw.githubusercontent.com/Stintik-123/vpn-configs-russia/main/BLACK_VLESS_RUS_mobile.txt"
      },
      {
        title: "BLACK VLESS RUS Full",
        desc: "Полная версия • Максимум серверов",
        url: "https://raw.githubusercontent.com/Stintik-123/vpn-configs-russia/main/BLACK_VLESS_RUS.txt"
      },
      {
        title: "WHITE CIDR / Reality",
        desc: "Белые списки + Reality",
        url: "https://raw.githubusercontent.com/Stintik-123/vpn-configs-russia/main/white-cidr.txt" // подкорректируй путь
      }
      // Добавляй остальные по аналогии
    ];

    function createCard(sub) {
      const div = document.createElement('div');
      div.className = `bg-zinc-900 border border-white/10 rounded-3xl p-8 card-hover`;
      div.innerHTML = `
        <h3 class="text-3xl font-semibold mb-4">${sub.title}</h3>
        <p class="text-zinc-400 mb-10">${sub.desc}</p>
        <div class="flex gap-4">
          <button onclick="copyLink('${sub.url}')" class="flex-1 py-5 bg-white/5 hover:bg-white/10 border border-white/20 rounded-2xl font-medium transition">📋 Копировать ссылку</button>
          <button onclick="showQR('${sub.url}')" class="flex-1 py-5 border border-white/30 hover:border-white rounded-2xl font-medium transition">QR-код</button>
        </div>
      `;
      return div;
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => alert("✅ Ссылка скопирована в буфер"));
    }

    function showQR(url) {
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 bg-black/95 flex items-center justify-center z-[100]';
      modal.innerHTML = `
        <div class="bg-zinc-900 p-12 rounded-3xl text-center">
          <div id="qrcode" class="mx-auto"></div>
          <p class="mt-8 text-sm text-zinc-400">Сканируй для импорта в клиент</p>
        </div>
      `;
      document.body.appendChild(modal);
      new QRCode(document.getElementById("qrcode"), { text: url, width: 320, height: 320 });
      modal.onclick = () => modal.remove();
    }

  
    document.getElementById('subs-container').append(...subscriptions.map(createCard));

  
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => btn.style.color = '#67e8f9');
      btn.addEventListener('mouseleave', () => btn.style.color = '');
    });
  </script>
</body>
  </html>
