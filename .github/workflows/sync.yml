name: Sync Sources

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install aiohttp

      - name: Collect
        env:
          SOURCES_LIST: ${{ secrets.SOURCES_LIST }}
        run: python tools/collector.py

      - name: Clean
        run: python tools/clean.py

      - name: Test
        run: python tools/test.py

      - name: Commit alive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alive.txt
          git commit -m "Update candidates $(date)" || exit 0
          git push
